<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLO RangeLab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      color: #e5e7eb;
      background: linear-gradient(180deg, #050816 0%, #0a1021 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
    }
    .logo {
      width: auto;
      height: 76px;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.35));
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: -0.03em;
    }
    .photo {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.45);
    }
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      box-shadow: 0 16px 50px rgba(79, 70, 229, 0.25);
      font-weight: 700;
      text-decoration: none;
    }
    .support-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      color: #e5e7eb;
      background: rgba(79, 70, 229, 0.12);
      font-weight: 600;
      text-decoration: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease, transform 120ms ease;
    }
    .support-link:hover {
      border-color: rgba(79, 70, 229, 0.55);
      background: rgba(79, 70, 229, 0.18);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.28);
      text-decoration: none;
    }
    .support-icon {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(79, 70, 229, 0.32);
      border-radius: 50%;
      background: rgba(79, 70, 229, 0.14);
    }
    .support-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .support-label {
      font-size: 13px;
    }
    .download:hover { text-decoration: underline; }
    .release-message { max-width: 650px; white-space: pre-line; color: #cbd5e1; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="PLO RangeLab logo">
    <h1>PLO RangeLab</h1>
    <img class="photo" src="Screenshot.png" alt="PLO RangeLab range filtering interface screenshot">
    <a class="download" href="https://github.com/bpodol/landing/releases/download/v1.0.6/PLO-RangeLab_1.0.6_x64-setup.exe">Download desktop app 1.0.6</a>
    <p class="release-message" id="release-message" hidden></p>
    <a href="https://t.me/RangeLabTeam" class="support-link" target="_blank" rel="noopener" aria-label="Telegram support chat">
      <span class="support-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="presentation">
          <path d="M21.78 4.21a1.38 1.38 0 0 0-1.41-.17l-16.8 7.2a1.36 1.36 0 0 0-.82 1.18c-.02.58.4 1.1.99 1.2l4.25.86 1.25 4.14a1.37 1.37 0 0 0 1.1.97h.2c.32 0 .64-.12.9-.32l2.55-2.04 3.7 2.76c.24.18.52.27.81.27.18 0 .36-.03.53-.1.42-.15.73-.51.82-.95l3-13.92c.09-.4-.05-.83-.37-1.08ZM9.22 12.55l8.25-5.07-5.63 6.34-2.62-.53Zm2.78 5.95-1.02-3.34 5.71-6.42-4.15 8.87-.54.89Z"/>
        </svg>
      </span>
      <span class="support-label">Support chat</span>
    </a>
  </main>
  <script>
    fetch('/updates/announcement.json', { cache: 'no-store' })
      .then(function (response) { if (!response.ok) throw new Error('Unavailable'); return response.json(); })
      .then(function (release) {
        if (typeof release.version !== 'string' || !/^\d+\.\d+\.\d+$/.test(release.version) ||
            typeof release.download !== 'string' || typeof release.messages !== 'string') return;
        var url = new URL(release.download);
        if (url.protocol !== 'https:' || url.username || url.password || url.port ||
            url.hostname !== 'github.com' || !url.pathname.startsWith('/bpodol/landing/releases/download/')) return;
        var button = document.querySelector('a.download');
        button.href = url.href;
        button.textContent = 'Download desktop app ' + release.version;
        var message = document.getElementById('release-message');
        message.textContent = release.messages;
        message.hidden = !release.messages;
      })
      .catch(function () { /* Keep the existing download link when offline. */ });
  </script>
</body>
</html>
