name: Issue public free license

on:
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-public-free-license
  cancel-in-progress: false

jobs:
  issue-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Issue license
        env:
          LICENSE_PRIVATE_KEY_B64: ${{ secrets.LICENSE_PRIVATE_KEY_B64 }}
        run: python scripts/issue_free_license.py

      - name: Verify license
        run: python scripts/verify_free_license.py

      - name: Commit and push public license
        run: |
          if git diff --quiet -- licenses/free-license.json; then
            echo "Public license is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- licenses/free-license.json
          git commit -m "chore: issue monthly public license"
          git push origin HEAD:main
